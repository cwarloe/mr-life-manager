name: Apply HTML copy fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Take the patched HTML from html-copy-fixes
        run: |
          git fetch origin html-copy-fixes
          git checkout origin/html-copy-fixes -- \
            products/checklists/first-apartment/first-apartment-checklist.html \
            products/checklists/cleaning-supplies/cleaning-supply-starter-list.html
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/checklists/first-apartment/first-apartment-checklist.html products/checklists/cleaning-supplies/cleaning-supply-starter-list.html
          git diff --cached --quiet && echo 'no changes' && exit 0
          git commit -m "Patch insurance price and vinegar-on-stone in guide HTML"
          git push origin HEAD:main
