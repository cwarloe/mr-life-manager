name: Import research handoff

on:
  push:
    branches:
      - codex-research-handoff
    paths:
      - .github/workflows/import-research-handoff.yml

permissions:
  contents: write

jobs:
  import-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Check out handoff branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply packaged research reports
        shell: bash
        run: |
          set -euo pipefail
          ZIP="mr-life-manager-research-report-handoff.zip"
          DEST="docs/research/competitive-landscape"
          TMP="$RUNNER_TEMP/research-report-handoff"

          test -f "$ZIP"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git am --3way "$TMP/research-report-handoff/0001-Add-competitive-landscape-research-reports.patch"

          test "$(git hash-object "$DEST/claude-opus-5-high_2026-09-05-1.md")" = "e5170be4976ff53c33ac423d5de2b007aad96363"
          test "$(git hash-object "$DEST/competitive-landscape-2026-09-06.md")" = "2b325a80cdcf3381d98d935dba5a12d598010ff8"
          test "$(git hash-object "$DEST/competitive-landscape-adult-life-systems.md")" = "0072a93c8dfdb9bccd31c38c90b45c32a9c2b893"

          git rm "$ZIP"
          git commit -m "Remove temporary research handoff package [skip ci]"
          git push origin HEAD:codex-research-handoff
