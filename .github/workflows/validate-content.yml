name: Validate repository content

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.md"
      - "products/guides-pdf/**"
      - "products/landing/assets/**"
      - "products/print/**"
      - ".github/scripts/build_site.py"
      - ".github/scripts/site_catalog.py"
      - ".github/scripts/guide_inventory.py"
      - ".github/scripts/check_built_site.py"
      - ".github/scripts/validate_repo.py"
      - ".github/scripts/check_pdfs_fresh.py"
      - ".github/scripts/check_entry_pages.py"
      - ".github/workflows/validate-content.yml"
      - ".github/workflows/reuse-validate-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/reuse-validate-build.yml
