name: Validate repository content

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.md"
      - "products/guides-pdf/**"
      - "products/landing/assets/**"
      - "products/print/**"
      - ".github/scripts/build_site.py"
      - ".github/scripts/preview_site.py"
      - ".github/scripts/check_preview_site.py"
      - ".github/scripts/site_catalog.py"
      - ".github/scripts/guide_inventory.py"
      - ".github/scripts/check_built_site.py"
      - ".github/scripts/validate_repo.py"
      - ".github/scripts/check_pdfs_fresh.py"
      - ".github/scripts/check_entry_pages.py"
      - ".github/scripts/check_journey_quality.py"
      - ".github/scripts/check_theme.py"
      - ".github/scripts/theme_tokens.py"
      - ".github/scripts/generate_share_assets.py"
      - "tests/test_journey_quality.py"
      - "tests/test_campaign_flows.py"
      - "tests/requirements-browser.txt"
      - ".github/workflows/validate-content.yml"
      - ".github/workflows/reuse-validate-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/reuse-validate-build.yml

  # A separate, dependency-free control for the first useful action. It does
  # not call Umami, submit forms, touch live accounts, or publish the site.
  journey-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Confirm published tasks remain actionable and analytics events stable
        run: python3 .github/scripts/check_journey_quality.py --out artifacts/journey-quality.json
      - name: Exercise deliberate step, route and measurement-contract failures
        run: python3 -m unittest discover -s tests -p 'test_journey_quality.py' -v
      - name: Keep inspectable journey evidence even after a failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-win-journey-quality
          path: artifacts/journey-quality.json
          if-no-files-found: warn
          retention-days: 14

  # Browser tests exercise the built local site; external requests are blocked
  # in the test context, so CI cannot submit a form or visit a live account.
  mobile-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned browser-test runtime
        run: |
          python3 -m venv .venv-browser
          .venv-browser/bin/python -m pip install -r tests/requirements-browser.txt
          .venv-browser/bin/python -m playwright install --with-deps chromium
      - name: Build the local site
        run: python3 .github/scripts/build_site.py
      - name: Check mobile start, schedule, calendar return, resume and print
        run: .venv-browser/bin/python tests/test_campaign_flows.py -v
