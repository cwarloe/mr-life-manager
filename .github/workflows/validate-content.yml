name: Validate repository content

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.md"
      - "products/guides-pdf/**"
      - ".github/scripts/validate_repo.py"
      - ".github/scripts/check_pdfs_fresh.py"
      - ".github/workflows/validate-content.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML structure and local links
        run: python .github/scripts/validate_repo.py

      - name: Printables match their sources
        run: python .github/scripts/check_pdfs_fresh.py
