name: One-room excuse list

on:
  push:
    paths:
      - ".github/trigger-one-room-excuses"
      - ".github/scripts/patch_one_room_excuses.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch one-room.html
        run: python3 .github/scripts/patch_one_room_excuses.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/landing/one-room.html
          git diff --cached --quiet && echo no changes && exit 0
          git commit -m "Show Dave's excuse list as quoted lines on the one-room page"
          git push origin HEAD:main
