name: Deploy landing to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "products/landing/*.html"
      - "products/landing/assets/**"
      - "products/landing/templates/**"
      - "products/landing/favicon.svg"
      - "products/landing/site.webmanifest"
      - "products/landing/CNAME"
      - "products/checklists/**"
      - "products/worksheets/**"
      - "products/print/**"
      - "products/guides-pdf/**"
      - ".github/scripts/build_site.py"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate before publishing
        run: |
          python3 .github/scripts/validate_repo.py
          python3 .github/scripts/check_pdfs_fresh.py
          python3 .github/scripts/check_entry_pages.py

      - name: Build site
        run: |
          python3 .github/scripts/build_site.py
          python3 .github/scripts/check_built_site.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
