name: Check live site

on:
  workflow_run:
    workflows: ["Deploy landing to GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check production routes and offer
        run: python3 .github/scripts/check_live_site.py

