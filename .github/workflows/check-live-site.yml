name: Check live site

on:
  workflow_run:
    workflows: ["Deploy landing to GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/check_live_site.py"
      - ".github/workflows/check-live-site.yml"

permissions:
  contents: read

concurrency:
  group: check-live-site
  cancel-in-progress: true

jobs:
  smoke-test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The workflow_run may be older than the current main branch.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Check production routes and offer
        env:
          EXPECTED_DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: python3 .github/scripts/check_live_site.py

